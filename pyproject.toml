[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "difficult_dialogs"
dynamic = ["version"]
description = "Structured argument framework for meaningful debates"
readme = "readme.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "JarbasAl", email = "jarbasai@protonmail.com"}
]
keywords = [
    "argument",
    "debate",
    "dialog",
    "llm",
    "reasoning",
    "logic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "ovos-solver-yes-no-plugin",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
cli = [
    "tqdm>=4.65.0",
]
export = []
web = [
    "streamlit>=1.28.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]
all = [
    "tqdm>=4.65.0",
    "streamlit>=1.28.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[project.scripts]
difficult-dialogs = "difficult_dialogs.cli:main"
did = "difficult_dialogs.cli:main"

[project.urls]
Homepage = "https://github.com/JarbasAl/difficult_dialogs"
Documentation = "https://github.com/JarbasAl/difficult_dialogs#readme"
Repository = "https://github.com/JarbasAl/difficult_dialogs"
Issues = "https://github.com/JarbasAl/difficult_dialogs/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["difficult_dialogs*"]

[tool.setuptools.dynamic]
version = {attr = "difficult_dialogs.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
