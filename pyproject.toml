[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "difficult_dialogs"
version = "0.3"
description = "Tools to easily guide conversations towards a certain objective"
readme = "readme.md"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/JarbasAl/difficult_dialogs"

[tool.setuptools.packages.find]
where = ["."]
include = ["difficult_dialogs*"]
